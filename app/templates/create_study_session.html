<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create Study Session | Study Buddy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> 
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"> -->
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <h2>📚 Study Buddy</h2>
        <div class="nav-links">
            <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('main.profile') }}">My Profile</a>
            <a href="{{ url_for('main.logout') }}">Logout</a>
        </div>
    </div>

    <!-- Main -->
    <div class="container">

        <div class="header">
            <h3>Create a Study Session</h3>
        </div>

        <div class="card">
            <form method="POST" action="{{ url_for('main.create_session') }}">

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="e.g. Calculus, Databases, Physics"
                        required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="4"
                        placeholder="What will you study? Any requirements?" required></textarea>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="form-group">
                    <label for="time">Time</label>
                    <input type="time" id="time" name="time" required>
                </div>

                <div class="form-group">
                    <label for="location">Location / Online</label>
                    <input type="text" id="location" name="location" placeholder="Library, Room 203, Zoom, Discord…"
                        required>
                </div>

                <button type="submit" class="post-btn">
                    Create Session
                </button>

            </form>
        </div>

    </div>

</body>

</html>
