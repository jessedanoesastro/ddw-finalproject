{% extends "base.html" %}

{% block title %}Create Study Session | Study Buddy{% endblock %}

{% block content %}
<div class="header">
    <h3>Create a Study Session</h3>
</div>

<div class="card">
    <form method="POST" action="{{ url_for('main.create_request') }}">

        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="e.g. Calculus, Databases, Physics" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" placeholder="What will you study? Any requirements?" required></textarea>
        </div>

        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>
        </div>

        <div class="form-group">
            <label for="time">Time</label>
            <input type="time" id="time" name="time" required>
        </div>

        <div class="form-group">
            <label for="location">Location / Online</label>
            <input type="text" id="location" name="location" placeholder="Library, Room 203, Zoom, Discord…" required>
        </div>

        <button type="submit" class="post-btn">
            Create Session
        </button>

    </form>
</div>
{% endblock %}
