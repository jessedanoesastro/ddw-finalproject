{% extends "base.html" %}

{% block title %}Edit Session | Study Buddy{% endblock %}

{% block content %}
<div class="header">
    <h3>Edit Study Session</h3>
</div>

<div class="card">
    <form method="POST">
        <div class="form-group">
            <label>Subject</label>
            <input type="text" name="subject" value="{{ s.subject }}" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="4" required>{{ s.description }}</textarea>
        </div>

        <div class="form-group">
            <label>Date</label>
            <input type="date" name="date" value="{{ date_value }}" required>
        </div>

        <div class="form-group">
            <label>Time</label>
            <input type="time" name="time" value="{{ time_value }}" required>
        </div>

        <div class="form-group">
            <label>Location</label>
            <input type="text" name="location" value="{{ s.location }}" required>
        </div>

        <button type="submit" class="post-btn">Save Changes</button>
    </form>
</div>
{% endblock %}
