<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register | Study Buddy</title>
    <link rel="stylesheet" href="../../css/style.css">
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"> -->
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <h2>📚 Study Buddy</h2>
        <a href="{{ url_for('home') }}">Home</a>
    </div>

    <!-- Main -->
    <div class="container">

        <div class="header">
            <h3>Create an Account</h3>
        </div>

        <div class="card">
            <form method="POST" action="{{ url_for('register') }}">

                <!-- Basic info -->
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <!-- Additional info -->
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="16" max="100" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select gender</option>
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                        <option value="nonbinary">Non-binary</option>
                        <option value="prefer_not_say">Prefer not to say</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="study">Program / Major</label>
                    <input type="text" id="study" name="study" placeholder="e.g. Computer Science" required>
                </div>

                <div class="form-group">
                    <label for="faculty">Faculty</label>
                    <select id="faculty" name="faculty" required>
                        <option value="">Select faculty</option>
                        <option value="science">Science</option>
                        <option value="engineering">Engineering</option>
                        <option value="arts">Arts & Humanities</option>
                        <option value="business">Business</option>
                        <option value="health">Health Sciences</option>
                        <option value="law">Law</option>
                        <option value="education">Education</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="grad_year">Graduation Year</label>
                    <input type="number" id="grad_year" name="grad_year" min="2024" max="2035" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="post-btn">
                    Register
                </button>

            </form>

            <p class="form-footer">
                Already have an account?
                <a href="{{ url_for('login') }}">Log in</a>
            </p>
        </div>

    </div>

</body>

</html>
