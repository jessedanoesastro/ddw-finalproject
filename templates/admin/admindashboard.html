<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | Study Buddy</title>
    <link rel="stylesheet" href="../../css/style.css">
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"> -->
</head>

<body>

    <!-- Admin Navbar -->
    <div class="navbar admin-nav">
        <h2>🛠 Study Buddy Admin</h2>
        <div class="nav-links">
            <a href="{{ url_for('admin_dashboard') }}">Overview</a>
            <a href="{{ url_for('admin_sessions') }}">Sessions</a>
            <a href="{{ url_for('admin_users') }}">Users</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </div>

    <div class="container">

        <div class="header">
            <h3>Database Overview</h3>
        </div>

        <div class="stats-grid">

            <div class="card stat-card">
                <h4>Total Users</h4>
                <p class="stat-number">{{ total_users }}</p>
            </div>

            <div class="card stat-card">
                <h4>Active Study Sessions</h4>
                <p class="stat-number">{{ active_sessions }}</p>
            </div>

        </div>

    </div>

</body>

</html>
